[package]
# Your plugin's id: lowercase letters, digits and dashes. It names the
# executable, the release files and the plugin's entry in the registry.
name = "icecast-endpoint"
version = "0.5.1"
edition = "2024"
description = "Allows for an Icecast mount, such as Broadcastify, to be used as an audio endpoint."
license = "MIT"
repository = "https://github.com/jschmall/icecast-endpoint"
authors = ["Jared Schmall <jared@schmall.me>"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.8.0"
# The settings form is drawn from your config structs' JSON Schema. Keep the
# major version the SDK uses (1).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MP3 encoding: LAME 3.100, built from source into the binary (LGPL).
mp3lame-encoder = "0.2.5"

[profile.release]
strip = true
lto = true
